
<!DOCTYPE html>
<html>
<head>
    <title>Edit Post - Connectly</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f3ff;
        }

        .container {
            width: 600px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h2 {
            color: #6c3cff;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            resize: vertical;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            font-size: 15px;
        }

        .buttons {
            margin-top: 15px;
        }

        button {
            background: #6c3cff;
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .cancel {
            margin-left: 10px;
            text-decoration: none;
            color: #666;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>✏️ Edit Your Post</h2>

    <form method="POST">

        {% csrf_token %}

        <textarea name="content" required>{{ post.content }}</textarea>

        <div class="buttons">

            <button type="submit">
                Save Changes
            </button>

            <a href="{% url 'home' %}" class="cancel">
                Cancel
            </a>

        </div>

    </form>

</div>

</body>
</html>
