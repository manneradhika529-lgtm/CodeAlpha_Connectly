<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connectly - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(
                135deg,
                #fff0f4,
                #f0eaff
            );
        }

        .login-container {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 22px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.1);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            background: linear-gradient(
                45deg,
                #ff4d6d,
                #8b5cf6
            );
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            color: #555;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
        }

        .input-group input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }

        .login-btn {
            width: 100%;
            border: none;
            padding: 13px;
            border-radius: 25px;
            background: linear-gradient(
                45deg,
                #ff4d6d,
                #8b5cf6
            );
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-btn:hover {
            transform: translateY(-1px);
        }

        .signup-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #777;
        }

        .signup-link a {
            color: #7c3aed;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">
            Connectly
        </div>

        <p class="subtitle">
            Welcome back! 👋
        </p>

        <h2>Login to your account</h2>

        <form method="POST">

            {% csrf_token %}

            <div class="input-group">
                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    required
                >
            </div>

            <div class="input-group">
                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>

        </form>

        <div class="signup-link">
            Don't have an account?
            <a href="{% url 'signup' %}">
                Create Account
            </a>
        </div>

    </div>

</body>
</html>
